name: Validate and Publish Scraper

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: scraper-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dna-futsal-app/dna_scrapper

jobs:

  validate:
    name: Validate scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B test


  publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master
            type=raw,value=latest

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy scraper to production

    runs-on: ubuntu-latest

    needs:
      - publish

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.AUTO_DEPLOY_ENABLED == 'true'

    steps:

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}

        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable image to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}

        run: |
          set -Eeuo pipefail

          TAG="sha-${GITHUB_SHA::7}"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "/opt/dna-futsal/scripts/deploy-service.sh scraper '$TAG'"